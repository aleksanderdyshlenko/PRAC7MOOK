<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>JavaScript практика</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            color: #fff;
        }
        h1, p {
            text-align: center;
            text-shadow: 0 0 10px #000, 0 0 20px #000;
        }
        button {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Интерактивная страница</h1>

    <button id="myButton">Нажми меня</button>
    <p id="text">Привет, мир!</p>

    <button id="bgButton">Изменить фон</button>

    <script src="script.js"></script>
</body>
</html>
